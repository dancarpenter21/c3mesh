name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Test all features
        run: cargo +${{ matrix.toolchain }} test --all-targets --all-features
      - name: Test minimal features
        run: cargo +${{ matrix.toolchain }} test --all-targets --no-default-features

  quality:
    name: Formatting, linting, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Run clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test documentation
        run: cargo +stable test --doc --all-features
      - name: Verify package
        run: cargo +stable publish --dry-run --all-features
