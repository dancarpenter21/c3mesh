[package]
name = "c3mesh"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic discrete-event simulation for fixed and mobile communication networks"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/c3mesh"
repository = "https://github.com/dancarpenter21/c3mesh"
keywords = ["network", "simulation", "mobility", "communications", "discrete-event"]
categories = ["network-programming", "simulation"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
default = []
json = ["dep:serde_json"]
yaml = ["dep:yaml_serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
yaml_serde = { version = "0.10", optional = true }

[[example]]
name = "yaml_switch"
required-features = ["yaml"]

[[example]]
name = "json_router"
required-features = ["json"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
